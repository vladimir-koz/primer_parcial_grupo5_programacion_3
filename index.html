<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de tarjetas</title>
    <meta name="description" content="Galería de tarjetas con cambio de layout, ordenamiento por cantidad de likes y fecha de publicación.">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="/assets/favicon/icon.png">

    <script defer src="js/scripts.js"></script>
</head>
<body>
    <main>
        <section class="controls">
            <button class="controls__button" type="button"><img src="/assets/images/grilla.png" alt="layout flex en grilla"></button>
            <button class="controls__button" type="button"><img src="/assets/images/feed.png" alt="Layout Feed"></button>

            <label for="orderBy">Ordenar por:</label>
            <select class="controls__button" name="orderBy" id="orderBy">
                <option value="creationDate">Fecha</option>
                <option value="likes">Likes</option>
            </select>
            <select name="order" id="order" class="controls__button">
                <option value="ASC">Ascendente</option>
                <option value="DESC">Descendente</option>
            </select>
        </section>

         <section class="layout-feed">
            <div id="cards-container" class="layout-feed__cards">
            </div>
        </section> 
    </main>

</body>
</html>
